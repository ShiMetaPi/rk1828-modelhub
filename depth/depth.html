<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>深度相机 · Depth-Anything-V3</title>
<style>
  /* 蓝白渐变 · Apple 风对比稿：蓝白配色、毛玻璃卡片、系统蓝 #007AFF、
     分段控制器、大圆角软阴影、居中轻标题——优雅直观 */
  :root {
    --blue: #007aff;          /* Apple 系统蓝 */
    --blue-hover: #0066cc;
    --blue-tint: #e8f2ff;
    --text: #1d1d1f;          /* Apple 近黑 */
    --text-2: #6e6e73;        /* Apple 次级灰 */
    --text-3: #8e8e93;
    --hairline: rgba(0, 0, 0, .08);
    --card: rgba(255, 255, 255, .78);
    --card-solid: rgba(255, 255, 255, .94);
    --fill: #f2f2f7;          /* systemGray6 */
    --shadow: 0 10px 30px rgba(15, 70, 150, .10);
    --shadow-sm: 0 2px 10px rgba(15, 70, 150, .07);
    --ok: #34c759; --warn: #ff9500; --err: #ff3b30;
    --sans: -apple-system, "SF Pro Display", "Helvetica Neue", "Noto Sans CJK SC",
            "PingFang SC", "Microsoft YaHei", sans-serif;
    --mono: ui-monospace, "SF Mono", Menlo, Consolas, "Noto Sans Mono CJK SC", monospace;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: var(--sans);
    /* 蓝白渐变画布：顶部淡蓝晕染渐入纯白 */
    background:
      radial-gradient(1100px 500px at 50% -8%, rgba(120, 175, 255, .28), transparent 70%),
      linear-gradient(180deg, #e3effc 0%, #f0f6fe 32%, #fbfdff 66%, #ffffff 100%);
    background-attachment: fixed;
    color: var(--text);
    min-height: 100vh;
    display: flex;
    justify-content: center;
    padding: 56px 20px 80px;
  }
  ::selection { background: rgba(0, 122, 255, .18); }
  :focus-visible { outline: 3px solid rgba(0, 122, 255, .45); outline-offset: 2px; border-radius: 6px; }
  .wrap { width: min(920px, 100%); }

  /* ── 居中轻刊头 ───────────────────────────────────────────────────── */
  .hero { text-align: center; margin-bottom: 30px;
          animation: rise .55s cubic-bezier(.25,.1,.25,1) both; }
  .tag { display: inline-block; font-size: 11.5px; font-weight: 600; letter-spacing: .04em;
         color: #0a63d2; background: var(--blue-tint);
         padding: 5px 13px; border-radius: 9999px; margin-bottom: 14px; }
  .hero h1 { font-size: 34px; font-weight: 700; letter-spacing: -0.022em; line-height: 1.1;
             color: var(--blue); }
  .hero .lede { margin-top: 10px; font-size: 14.5px; color: var(--text-2); line-height: 1.6; }

  /* ── 毛玻璃卡片基座 ───────────────────────────────────────────────── */
  .card {
    background: var(--card);
    backdrop-filter: blur(20px) saturate(1.35);
    -webkit-backdrop-filter: blur(20px) saturate(1.35);
    border: 1px solid var(--hairline);
    border-radius: 18px;
    box-shadow: var(--shadow);
  }

  /* ── 输入卡：iOS 分段控制器切「拍摄 / 上传」─────────────────────── */
  .source { padding: 22px; display: flex; flex-direction: column; gap: 18px;
            align-items: center;
            animation: rise .55s cubic-bezier(.25,.1,.25,1) both; animation-delay: .07s; }
  .seg { display: inline-flex; background: #e6edf6; border-radius: 10px; padding: 3px; }
  .seg button {
    border: 0; background: transparent; cursor: pointer;
    padding: 7px 30px; border-radius: 8px;
    font-family: var(--sans); font-size: 13.5px; font-weight: 500; color: var(--text-2);
    transition: color .2s, background .2s, box-shadow .2s;
  }
  .seg button.on {
    background: #fff; color: var(--text); font-weight: 600;
    box-shadow: 0 1px 4px rgba(0, 0, 0, .12);
  }
  .pane { width: 100%; display: flex; flex-direction: column; gap: 14px; }
  .pane[hidden] { display: none; }
  .src-hint { font-size: 12.5px; color: var(--text-3); line-height: 1.7; text-align: center; }

  #video {
    width: 100%;
    max-width: 560px;
    aspect-ratio: 1 / 1;   /* 方形取景 = 模型看到的中心方裁剪，所见即所得 */
    object-fit: cover;
    background: #0b1a2e;
    border-radius: 14px;
    display: block;
    margin: 0 auto;
    box-shadow: var(--shadow-sm);
  }
  .no-cam {
    width: 100%;
    max-width: 560px;
    aspect-ratio: 1 / 1;
    margin: 0 auto;
    background: var(--fill);
    border-radius: 14px;
    display: flex; align-items: center; justify-content: center;
    color: var(--text-3); font-size: 13px; padding: 24px; text-align: center; line-height: 1.7;
  }
  .cam-row { display: flex; align-items: center; gap: 16px; justify-content: center; flex-wrap: wrap; }
  /* CTA：系统蓝胶囊按钮 */
  .shot-btn {
    border: 0; background: var(--blue); color: #fff;
    font-family: var(--sans); font-size: 15px; font-weight: 600; letter-spacing: .01em;
    height: 46px; padding: 0 30px; border-radius: 9999px; cursor: pointer;
    display: flex; align-items: center; gap: 10px;
    box-shadow: 0 6px 16px rgba(0, 122, 255, .28);
    transition: background .2s, transform .15s, box-shadow .2s;
  }
  .shot-btn .dot { width: 9px; height: 9px; border-radius: 50%; background: #fff; }
  .shot-btn:hover:not(:disabled) { background: var(--blue-hover); }
  .shot-btn:active:not(:disabled) { transform: scale(.97); }
  .shot-btn:disabled { opacity: .35; cursor: not-allowed; box-shadow: none; }

  .drop {
    display: flex; align-items: center; justify-content: center;
    max-width: 560px; width: 100%; margin: 0 auto;
    min-height: 220px;
    border: 1.5px dashed rgba(0, 0, 0, .16); border-radius: 14px;
    font-size: 13px; color: var(--text-2); cursor: pointer;
    transition: border-color .2s, background .2s, color .2s;
  }
  .drop:hover, .drop.over { border-color: var(--blue); background: rgba(0, 122, 255, .05); color: #0a63d2; }
  .drop input { display: none; }

  /* ── 状态条：白色小胶囊 ───────────────────────────────────────────── */
  .statusbar {
    margin-top: 16px; padding: 11px 18px;
    display: flex; align-items: center; gap: 10px; flex-wrap: wrap;
    font-size: 12.5px; color: var(--text-2);
    font-variant-numeric: tabular-nums;
    animation: rise .55s cubic-bezier(.25,.1,.25,1) both; animation-delay: .14s;
  }
  .status-dot { width: 8px; height: 8px; border-radius: 50%; background: var(--ok); flex-shrink: 0; }
  .status-dot.busy { background: var(--warn); animation: blink 1.1s ease-in-out infinite; }
  .status-dot.err  { background: var(--err); }
  @keyframes blink { 50% { opacity: .25; } }
  .chip { background: var(--fill); border-radius: 9999px; padding: 3px 11px; font-size: 11.5px; }
  .statusbar .spacer { flex: 1; }
  .msg { font-family: var(--mono); font-variant-numeric: tabular-nums; }
  .msg.err { color: var(--err); }
  .msg.ok  { color: #248a3d; }

  /* ── 空态邀请 ─────────────────────────────────────────────────────── */
  #results:empty::after {
    content: "拍一张或传一张图，结果会出现在这里";
    display: block; text-align: center;
    margin-top: 16px; padding: 46px 20px;
    border: 1.5px dashed rgba(0, 0, 0, .12); border-radius: 18px;
    color: var(--text-3); font-size: 13px;
  }
  #results { margin-top: 16px; display: flex; flex-direction: column; gap: 16px; }
  .shot { padding: 22px 24px;
          animation: rise .5s cubic-bezier(.25,.1,.25,1) both; }
  .shot-head { display: flex; align-items: baseline; gap: 10px; margin-bottom: 14px; flex-wrap: wrap;
               font-size: 12px; color: var(--text-3); font-variant-numeric: tabular-nums; }
  .shot-head .n { font-size: 14px; color: var(--text); font-weight: 600; }
  .shot-head .spacer { flex: 1; }
  .pair { display: flex; gap: 12px; }
  .pair figure { flex: 1; min-width: 0; }
  .pair img {
    width: 100%; border-radius: 12px; display: block; cursor: zoom-in;
    background: #0b1a2e; transition: opacity .2s;
  }
  .pair img:hover { opacity: .92; }
  .pair figcaption { font-size: 11.5px; color: var(--text-3); text-align: center; margin-top: 8px; }
  .ov-title { font-size: 11.5px; color: var(--text-3); margin: 18px 0 8px; text-align: center; }
  .ov-wrap { display: flex; gap: 12px; max-width: 620px; margin: 0 auto; align-items: stretch; }
  .ov-box { position: relative; flex: 1; min-width: 0; border-radius: 12px; overflow: hidden;
            box-shadow: var(--shadow-sm); }
  .ov-box img { width: 100%; display: block; }
  .ov-box .top { position: absolute; inset: 0; }
  .cbar { width: 52px; display: flex; flex-direction: column; align-items: center; gap: 5px;
          font-size: 11px; color: var(--text-3); flex-shrink: 0; }
  .cbar .lab { display: flex; align-items: center; gap: 3px; white-space: nowrap; }
  .cbar .grad { flex: 1; width: 14px; border-radius: 7px; border: 1px solid var(--hairline); }
  .ov-ctl { display: flex; align-items: center; gap: 12px; margin-top: 12px; font-size: 12.5px;
            color: var(--text-2); max-width: 620px; margin-left: auto; margin-right: auto; }
  .ov-ctl input[type=range] { flex: 1; accent-color: var(--blue); }
  .dl { font-size: 11.5px; color: var(--blue); text-decoration: none;
        background: var(--blue-tint); border-radius: 9999px; padding: 4px 12px;
        transition: background .2s; }
  .dl:hover { background: #d6e9ff; }

  @keyframes rise { from { opacity: 0; transform: translateY(14px); } }
  @media (max-width: 760px) {
    body { padding: 36px 14px 60px; }
    .hero h1 { font-size: 27px; }
    .seg button { padding: 7px 18px; }
  }
  @media (prefers-reduced-motion: reduce) {
    * { animation: none !important; transition: none !important; }
  }
</style>
</head>
<body>
<div class="wrap">
  <header class="hero">
    <span class="tag">Depth-Anything-V3 · RKNN NPU</span>
    <h1>深度相机</h1>
    <p class="lede">拍一张，同时得到原图和它的相对深度图。近红远蓝，只有远近关系，不标米数。</p>
  </header>

  <section class="card source">
    <div class="seg" role="tablist">
      <button id="segCam" class="on" type="button">摄像头拍摄</button>
      <button id="segUp" type="button">上传图片</button>
    </div>

    <div class="pane" id="paneCam">
      <video id="video" autoplay playsinline muted style="display:none"></video>
      <div class="no-cam" id="noCam">正在打开摄像头…</div>
      <div class="cam-row">
        <button class="shot-btn" id="shotBtn" title="拍摄" disabled><div class="dot"></div>拍一张</button>
        <div class="src-hint">方形取景就是模型看到的中心裁剪。首次拍摄要加载模型（约十几秒），之后每张约 1 秒。</div>
      </div>
    </div>

    <div class="pane" id="paneUp" hidden>
      <label class="drop" id="drop">
        点这里选图片，或把图片拖进来
        <input type="file" id="file" accept="image/*">
      </label>
      <div class="src-hint">没有摄像头也能玩：任意 JPG/PNG 上传（自动取中央方形区域）。图片只在板子上处理。</div>
    </div>
  </section>

  <div class="card statusbar">
    <div class="status-dot" id="dot"></div>
    <span id="stateTxt">连接服务中…</span>
    <span class="chip" id="resChip" style="display:none"></span>
    <div class="spacer"></div>
    <span class="msg" id="msg"></span>
  </div>

  <div id="results"></div>
</div>

<script>
const video   = document.getElementById("video");
const noCam   = document.getElementById("noCam");
const shotBtn = document.getElementById("shotBtn");
const drop    = document.getElementById("drop");
const fileIn  = document.getElementById("file");
const dot     = document.getElementById("dot");
const stateTxt= document.getElementById("stateTxt");
const resChip = document.getElementById("resChip");
const msg     = document.getElementById("msg");
const results = document.getElementById("results");

let serviceUp = false;
let busy = false;
let shotN = 0;

function setMsg(t, ok=false, err=false) {
  msg.textContent = t;
  msg.className = "msg" + (ok ? " ok" : err ? " err" : "");
}
function setState(txt, mode) {  // mode: "" | busy | err
  stateTxt.textContent = txt;
  dot.className = "status-dot" + (mode === "busy" ? " busy" : mode === "err" ? " err" : "");
}

// ── 分段控制器：拍摄 / 上传 ──────────────────────────────────────────
const segCam  = document.getElementById("segCam");
const segUp   = document.getElementById("segUp");
const paneCam = document.getElementById("paneCam");
const paneUp  = document.getElementById("paneUp");
function pick(which) {
  const cam = which === "cam";
  segCam.classList.toggle("on", cam);
  segUp.classList.toggle("on", !cam);
  paneCam.hidden = !cam;
  paneUp.hidden = cam;
}
segCam.addEventListener("click", () => pick("cam"));
segUp.addEventListener("click", () => pick("up"));

// ── 摄像头 ──────────────────────────────────────────────────────────
let camDeviceId = null;   // 试出来的可用设备（记住后刷新也直接用）

async function tryOpenCamera(constraints) {
  const stream = await navigator.mediaDevices.getUserMedia(constraints);
  // 拿到流才算这个设备真能出图（板上有 20 个 video 节点，多数是 ISP，起不动流）
  if (stream.getVideoTracks().length === 0) {
    stream.getTracks().forEach(t => t.stop());
    throw new Error("无视频轨");
  }
  return stream;
}

async function startCamera() {
  if (!navigator.mediaDevices || !window.isSecureContext) {
    noCam.textContent = "此环境不允许摄像头（需板上浏览器或 localhost），请切到「上传图片」";
    return;
  }
  const base = { width: { ideal: 1280 }, height: { ideal: 960 } };
  // 依次尝试：记住的设备 → 默认 → 枚举出的每个视频设备
  const attempts = [];
  if (camDeviceId) attempts.push({ video: { deviceId: { exact: camDeviceId }, ...base }, audio: false });
  attempts.push({ video: { ...base }, audio: false });
  try {
    const devs = await navigator.mediaDevices.enumerateDevices();
    for (const d of devs)
      if (d.kind === "videoinput" && d.deviceId !== camDeviceId)
        attempts.push({ video: { deviceId: { exact: d.deviceId }, ...base }, audio: false });
  } catch {}
  for (const c of attempts) {
    try {
      const stream = await tryOpenCamera(c);
      camDeviceId = stream.getVideoTracks()[0].getSettings().deviceId || camDeviceId;
      video.srcObject = stream;
      video.style.display = "";
      noCam.style.display = "none";
      shotBtn.disabled = false;
      return;
    } catch (e) { /* 换下一个设备 */ }
  }
  noCam.textContent = "摄像头打开失败：所有视频设备都起不动（确认 USB 摄像头插好），请切到「上传图片」";
}
// ?nocam=1：跳过摄像头（测试/截图钩子，也照顾没摄像头的环境）
const Q = new URLSearchParams(location.search);
if (Q.get("nocam") === "1") {
  noCam.textContent = "摄像头已停用（?nocam=1）——切到「上传图片」同样能出深度图";
} else {
  startCamera();
}

// 任意源（video 帧 / 上传文件）→ 中心方裁剪 → 归一化 JPEG
// 模型输入是固定 280×280 方形，取画面正中的正方形区域：原图和深度图同构图不变形
async function sourceToJpeg(src, w, h) {
  const side = Math.min(w, h);
  const sx = (w - side) / 2, sy = (h - side) / 2;
  const scale = Math.min(1, 1280 / side);
  const c = document.createElement("canvas");
  c.width = c.height = Math.max(1, Math.round(side * scale));
  c.getContext("2d").drawImage(src, sx, sy, side, side, 0, 0, c.width, c.height);
  return await new Promise(r => c.toBlob(r, "image/jpeg", 0.9));
}

// ── 提交 + 渲染 ─────────────────────────────────────────────────────
async function submit(blob, originalUrl) {
  if (busy) { setMsg("正在处理上一张，稍等", err=true); return; }
  busy = true;
  shotBtn.disabled = true;
  shotN += 1;
  const n = shotN;
  setMsg("第 " + n + " 张推理中…");
  setState("推理中", "busy");
  try {
    const r = await fetch("/api/capture", { method: "POST", body: blob });
    if (!r.ok) {
      let e = "HTTP " + r.status;
      try { e = (await r.json()).error || e; } catch {}
      throw new Error(e);
    }
    const stats = JSON.parse(r.headers.get("X-Depth-Stats") || "{}");
    const depthUrl = URL.createObjectURL(await r.blob());
    addShot(n, originalUrl, depthUrl, stats);
    const ms = stats.ms || {};
    setMsg("第 " + n + " 张完成 · " + Math.round(ms.total || 0) + "ms"
      + "（local " + Math.round(ms.local || 0) + " / global " + Math.round(ms.global || 0)
      + " / head " + Math.round(ms.head || 0) + "）", ok=true);
    setState("就绪", "");
  } catch (e) {
    setMsg("失败: " + e.message, err=true);
    setState("出错", "err");
  } finally {
    busy = false;
    shotBtn.disabled = false;
  }
}

// turbo 色表（与引擎同一组多项式，保证色条和深度图颜色一致）
function turboCss(t) {
  const x = Math.min(1, Math.max(0, t));
  const x2 = x*x, x3 = x2*x, x4 = x3*x, x5 = x4*x;
  const cl = v => Math.round(Math.min(1, Math.max(0, v)) * 255);
  const r = cl(0.13572138 + 4.61539260*x - 42.66032258*x2 + 132.13108234*x3 - 152.94239396*x4 + 59.28637943*x5);
  const g = cl(0.09140261 + 2.19418839*x + 4.84296658*x2 - 14.18503333*x3 + 4.27729857*x4 + 2.82956604*x5);
  const b = cl(0.10667330 + 12.64194608*x - 60.58204836*x2 + 110.36276771*x3 - 89.90310912*x4 + 27.34824973*x5);
  return `rgb(${r},${g},${b})`;
}
function turboGradient(stops) {
  const cs = [];
  for (let i = 0; i <= stops; i++) {
    const t = i / stops;
    cs.push(turboCss(1 - t) + " " + Math.round(t * 100) + "%");  // 顶部红(近) → 底部蓝(远)
  }
  return "linear-gradient(to bottom, " + cs.join(",") + ")";
}

function addShot(n, originalUrl, depthUrl, stats) {
  const div = document.createElement("div");
  div.className = "shot card";
  const mrow = [];
  // DA3-BASE 输出相对深度（无米制量纲），不标假米数，只标耗时
  if (stats.ms) mrow.push("耗时 " + Math.round(stats.ms.total || 0) + "ms");
  div.innerHTML =
    '<div class="shot-head">'
    + '<span class="n">第 ' + n + ' 张</span>'
    + '<span>' + (mrow.join(" · ") || "") + '</span>'
    + '<span class="spacer"></span>'
    + '<a class="dl" download="depth_' + n + '_rgb.jpg" href="' + originalUrl + '">存原图</a>'
    + '<a class="dl" download="depth_' + n + '_depth.png" href="' + depthUrl + '">存深度图</a>'
    + '</div>'
    + '<div class="pair">'
    + '<figure><img src="' + originalUrl + '" alt="原图"><figcaption>原图（中心方裁剪）</figcaption></figure>'
    + '<figure><img src="' + depthUrl + '" alt="深度图"><figcaption>深度图（近红远蓝）</figcaption></figure>'
    + '</div>'
    + '<div class="ov-title">叠加对比（拖滑块混合原图和深度图，右侧色条=相对远近）</div>'
    + '<div class="ov-wrap">'
    + '<div class="ov-box">'
    + '<img src="' + originalUrl + '" alt="原图">'
    + '<img class="top" id="ov' + n + '" src="' + depthUrl + '" alt="深度图" style="opacity:.5">'
    + '</div>'
    + '<div class="cbar">'
    + '<span class="lab" style="color:#d0553f">近</span>'
    + '<div class="grad" title="相对深度：越红越近，越蓝越远（DA3-BASE 不输出绝对米数）"></div>'
    + '<span class="lab" style="color:#3e7dc8">远</span>'
    + '</div>'
    + '</div>'
    + '<div class="ov-ctl">'
    + '<span>原图</span>'
    + '<input type="range" min="0" max="100" value="50">'
    + '<span>深度图</span>'
    + '</div>';
  div.querySelectorAll(".pair img").forEach(im => im.addEventListener("click", () => window.open(im.src)));
  div.querySelector(".grad").style.background = turboGradient(24);
  const top = div.querySelector(".top");
  div.querySelector('input[type=range]').addEventListener("input", e => {
    top.style.opacity = e.target.value / 100;
  });
  results.insertBefore(div, results.firstChild);
}

// ── 拍摄 / 上传 ─────────────────────────────────────────────────────
shotBtn.addEventListener("click", () => {
  if (!video.videoWidth) { setMsg("摄像头还没准备好", err=true); return; }
  sourceToJpeg(video, video.videoWidth, video.videoHeight).then(b => {
    // 原图预览也用同一帧，和送进模型的内容完全一致
    submit(b, URL.createObjectURL(b));
  });
});

async function handleFile(f) {
  if (!f) return;
  if (busy) { setMsg("正在处理上一张，稍等", err=true); return; }
  if (!/^image\//.test(f.type)) { setMsg("不是图片文件", err=true); return; }
  setMsg("读取 " + f.name + " …");
  const img = new Image();
  img.onload = async () => {
    const b = await sourceToJpeg(img, img.naturalWidth, img.naturalHeight);
    URL.revokeObjectURL(img.src);
    submit(b, URL.createObjectURL(b));
  };
  img.onerror = () => setMsg("图片解码失败", err=true);
  img.src = URL.createObjectURL(f);
}
fileIn.addEventListener("change", () => handleFile(fileIn.files[0]));
drop.addEventListener("dragover", e => { e.preventDefault(); drop.classList.add("over"); });
drop.addEventListener("dragleave", () => drop.classList.remove("over"));
drop.addEventListener("drop", e => {
  e.preventDefault(); drop.classList.remove("over");
  handleFile(e.dataTransfer.files[0]);
});

// ── 服务探活 + 心跳 + 生命周期（与 asr/tts demo 同款）──────────────
async function pollStatus() {
  try {
    const r = await fetch("/api/status");
    if (r.ok) {
      if (!serviceUp) {
        serviceUp = true;
        const s = await r.json();
        setMsg("服务已连接");
      }
      heartbeat();
      return;
    }
  } catch {}
  serviceUp = false;
  setState("连接服务中…", "busy");
  setTimeout(pollStatus, 2000);
}
async function heartbeat() {
  try {
    const r = await fetch("/api/status");
    if (r.ok) {
      const s = await r.json();
      if (s.state === "ready") {
        setState("就绪", "");
        if (s.res) { resChip.style.display = ""; resChip.textContent = s.res + " · " + (s.views || 1) + " view"; }
      } else if (s.state === "loading") {
        setState("模型加载中（首次约十几秒）", "busy");
      } else if (s.state === "error") {
        setState("模型加载失败", "err");
      }
    }
    setTimeout(heartbeat, 5000);
  } catch {
    serviceUp = false;
    setState("服务已退出，请重新运行 start.sh 后刷新", "err");
  }
}
window.addEventListener("pageshow", () => { pollStatus(); });
window.addEventListener("pagehide", () => { navigator.sendBeacon("/api/bye"); });
