<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Qwen3-TTS 语音合成</title>
<style>
  /* 蓝白 Apple 风：与 depth_apple.html 同一套设计体系——
     系统蓝 #007aff、毛玻璃白卡、胶囊按钮、居中轻刊头、rise 进场 */
  :root {
    --blue: #007aff;          /* Apple 系统蓝 */
    --blue-hover: #0066cc;
    --blue-tint: #e8f2ff;
    --text: #1d1d1f;          /* Apple 近黑 */
    --text-2: #6e6e73;        /* Apple 次级灰 */
    --text-3: #8e8e93;
    --hairline: rgba(0, 0, 0, .08);
    --card: rgba(255, 255, 255, .78);
    --card-solid: rgba(255, 255, 255, .94);
    --fill: #f2f2f7;          /* systemGray6 */
    --shadow: 0 10px 30px rgba(15, 70, 150, .10);
    --shadow-sm: 0 2px 10px rgba(15, 70, 150, .07);
    --ok: #34c759; --warn: #ff9500; --err: #ff3b30;
    --sans: -apple-system, "SF Pro Display", "Helvetica Neue", "Noto Sans CJK SC",
            "PingFang SC", "Microsoft YaHei", sans-serif;
    --mono: ui-monospace, "SF Mono", Menlo, Consolas, "Noto Sans Mono CJK SC", monospace;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: var(--sans);
    /* 蓝白渐变画布：顶部淡蓝晕染渐入纯白 */
    background:
      radial-gradient(1100px 500px at 50% -8%, rgba(120, 175, 255, .28), transparent 70%),
      linear-gradient(180deg, #e3effc 0%, #f0f6fe 32%, #fbfdff 66%, #ffffff 100%);
    background-attachment: fixed;
    color: var(--text);
    min-height: 100vh;
    display: flex;
    justify-content: center;
    padding: 56px 20px 80px;
  }
  ::selection { background: rgba(0, 122, 255, .18); }
  :focus-visible { outline: 3px solid rgba(0, 122, 255, .45); outline-offset: 2px; border-radius: 6px; }
  .wrap { width: min(720px, 100%); }

  /* ── 居中轻刊头 ───────────────────────────────────────────────────── */
  .hero { text-align: center; margin-bottom: 30px;
          animation: rise .55s cubic-bezier(.25,.1,.25,1) both; }
  .tag { display: inline-block; font-size: 11.5px; font-weight: 600; letter-spacing: .04em;
         color: #0a63d2; background: var(--blue-tint);
         padding: 5px 13px; border-radius: 9999px; margin-bottom: 14px; }
  .hero h1 { font-size: 34px; font-weight: 700; letter-spacing: -0.022em; line-height: 1.1;
             color: var(--blue); }
  .hero .lede { margin-top: 10px; font-size: 14.5px; color: var(--text-2); line-height: 1.6; }

  /* ── 毛玻璃卡片基座 ───────────────────────────────────────────────── */
  .card {
    background: var(--card);
    backdrop-filter: blur(20px) saturate(1.35);
    -webkit-backdrop-filter: blur(20px) saturate(1.35);
    border: 1px solid var(--hairline);
    border-radius: 18px;
    box-shadow: var(--shadow);
  }

  /* ── 合成主卡：文本 / 语气 / 音色 / 克隆 / CTA ────────────────────── */
  .compose { padding: 26px 28px; display: flex; flex-direction: column; gap: 20px;
             animation: rise .55s cubic-bezier(.25,.1,.25,1) both; animation-delay: .07s; }
  .f-label { display: block; font-size: 12.5px; font-weight: 600; color: var(--text-2);
             letter-spacing: .02em; margin-bottom: 8px; }

  /* 输入控件：白底实卡、hairline 边、圆角 12、focus 蓝 */
  .field {
    width: 100%;
    background: var(--card-solid);
    border: 1px solid var(--hairline);
    border-radius: 12px;
    color: var(--text);
    font-size: 14.5px;
    font-family: inherit;
    padding: 12px 14px;
    outline: none;
    transition: border-color .2s, box-shadow .2s;
  }
  .field::placeholder { color: var(--text-3); }
  .field:focus { border-color: var(--blue); box-shadow: 0 0 0 3.5px rgba(0, 122, 255, .13); }
  textarea.field { height: 120px; resize: none; line-height: 1.7; font-size: 15px; }

  /* 音色下拉：appearance:none + 自绘箭头（单文件自包含，无外链资源） */
  .selwrap { position: relative; }
  .selwrap::after {
    content: ""; position: absolute; right: 17px; top: 50%;
    width: 8px; height: 8px; pointer-events: none;
    border-right: 1.8px solid var(--text-3); border-bottom: 1.8px solid var(--text-3);
    transform: translateY(-70%) rotate(45deg); border-radius: 1px;
  }
  select.sel {
    appearance: none; -webkit-appearance: none;
    padding-right: 40px; cursor: pointer;
  }

  /* 次级按钮：灰底胶囊（录音 / 提取 / 上传 / 删除音色） */
  .ghost {
    border: 0; background: var(--fill); color: var(--text);
    font-family: var(--sans); font-size: 13px; font-weight: 500;
    padding: 9px 16px; border-radius: 9999px; cursor: pointer;
    transition: background .2s, transform .15s;
  }
  .ghost:hover:not(:disabled) { background: #e8e8ed; }
  .ghost:active:not(:disabled) { transform: scale(.97); }
  .ghost:disabled { opacity: .45; cursor: not-allowed; }
  .danger { background: rgba(255, 59, 48, .07); color: var(--err);
            box-shadow: inset 0 0 0 1px rgba(255, 59, 48, .30); }
  .danger:hover:not(:disabled) { background: rgba(255, 59, 48, .13); }

  /* 声音克隆面板：内嵌浅灰区 */
  .voice-box { padding: 16px 18px; background: var(--fill); border-radius: 12px;
               display: flex; flex-direction: column; gap: 12px; }
  .vb-title { font-size: 12px; color: var(--text-2); line-height: 1.65; }
  .voice-row { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; }
  .voice-row input[type="text"] {
    flex: 1; min-width: 130px;
    background: var(--card-solid); border: 1px solid var(--hairline); border-radius: 10px;
    color: var(--text); font-size: 13.5px; font-family: inherit;
    padding: 9px 12px; outline: none; transition: border-color .2s, box-shadow .2s;
  }
  .voice-row input[type="text"]:focus { border-color: var(--blue); box-shadow: 0 0 0 3px rgba(0, 122, 255, .12); }
  .voice-row input[type="file"] {
    font-size: 12px; color: var(--text-2); max-width: 240px;
    background: var(--card-solid); border: 1px solid var(--hairline);
    border-radius: 10px; padding: 7px 10px;
  }

  /* 主 CTA：系统蓝胶囊 + 声波小图标 */
  .cta-row { display: flex; align-items: center; gap: 18px; flex-wrap: wrap; }
  .cta {
    border: 0; background: var(--blue); color: #fff;
    font-family: var(--sans); font-size: 15px; font-weight: 600; letter-spacing: .01em;
    height: 46px; padding: 0 30px; border-radius: 9999px; cursor: pointer;
    display: inline-flex; align-items: center; gap: 10px;
    box-shadow: 0 6px 16px rgba(0, 122, 255, .28);
    transition: background .2s, transform .15s, box-shadow .2s;
  }
  .cta:hover:not(:disabled) { background: var(--blue-hover); }
  .cta:active:not(:disabled) { transform: scale(.97); }
  .cta:disabled { opacity: .35; cursor: not-allowed; box-shadow: none; }
  .wave { display: inline-flex; align-items: center; gap: 2.5px; height: 15px; }
  .wave i { width: 2.5px; border-radius: 2px; background: #fff; }
  .wave i:nth-child(1) { height: 6px; }
  .wave i:nth-child(2) { height: 11px; }
  .wave i:nth-child(3) { height: 15px; }
  .wave i:nth-child(4) { height: 9px; }
  .hint { flex: 1; min-width: 220px; font-size: 12px; color: var(--text-3); line-height: 1.7; }

  /* ── 状态条：白色小胶囊，圆点跟随状态色 ───────────────────────────── */
  .statusbar {
    margin-top: 16px; padding: 12px 18px;
    display: flex; align-items: center;
    font-size: 12.5px; color: var(--text-2);
    animation: rise .55s cubic-bezier(.25,.1,.25,1) both; animation-delay: .14s;
  }
  .status { font-family: var(--mono); font-variant-numeric: tabular-nums; line-height: 1.6; }
  .status::before { content: ""; display: inline-block; width: 8px; height: 8px;
                    border-radius: 50%; background: currentColor; margin-right: 9px; }
  .status:empty::after { content: "正在连接服务…"; }
  .status.ok  { color: #248a3d; }
  .status.err { color: var(--err); }

  /* ── 结果卡：音频播放器（生成后出现，毛玻璃白卡）─────────────────── */
  .audio-wrap { display: none; margin-top: 16px; padding: 20px 24px; }
  .audio-wrap.show { display: block; animation: rise .5s cubic-bezier(.25,.1,.25,1) both; }
  .res-head { display: flex; align-items: baseline; gap: 10px; margin-bottom: 14px; }
  .res-head .t { font-size: 13.5px; font-weight: 600; }
  .res-head .n { font-size: 11.5px; color: var(--text-3); margin-left: auto; }
  audio { width: 100%; height: 44px; display: block; }

  @keyframes rise { from { opacity: 0; transform: translateY(14px); } }
  @media (max-width: 760px) {
    body { padding: 36px 14px 60px; }
    .hero h1 { font-size: 27px; }
    .compose { padding: 20px; }
    .hint { min-width: 100%; }
  }
  @media (prefers-reduced-motion: reduce) {
    * { animation: none !important; transition: none !important; }
  }
</style>
</head>
<body>
<div class="wrap">
  <header class="hero">
    <span class="tag">Qwen3-TTS 12Hz 1.7B · RKNN NPU</span>
    <h1>语音合成</h1>
    <p class="lede">输入文本，挑一种音色让它读出来；支持语气指令，也能录几秒人声克隆专属音色——全部在板子上完成。</p>
  </header>

  <section class="card compose">
    <div>
      <label class="f-label" for="text">输入文本</label>
      <textarea id="text" class="field" placeholder="输入要合成语音的文本，如：你好，欢迎使用语音合成 demo。"></textarea>
    </div>

    <div>
      <label class="f-label" for="instruct">语气指令（可选）</label>
      <input id="instruct" class="field" type="text" placeholder="如：用悲伤低沉、带哭腔的语气说。留空则自然朗读">
    </div>

    <div>
      <label class="f-label" for="speaker">音色（可选）</label>
      <div class="selwrap">
        <select id="speaker" class="field sel"></select>
      </div>
      <button id="delVoiceBtn" class="ghost danger" style="display:none; margin-top:10px;">删除当前自定义音色</button>
    </div>

    <div class="voice-box">
      <div class="vb-title">声音模仿（板上完成）：选一段 5~10 秒干净人声音频，或直接录音，提取成你的音色</div>
      <div class="voice-row">
        <input id="voiceAudio" type="file" accept="audio/*">
        <button id="recBtn" class="ghost">录音</button>
        <input id="voiceName" type="text" placeholder="音色名，如 myvoice">
        <button id="extractBtn" class="ghost">提取音色</button>
      </div>
      <div class="vb-title" style="margin-top:10px">已有 .npy 音色文件（tools/extract_spk_embed.py 生成）？直接上传：</div>
      <div class="voice-row">
        <input id="voiceFile" type="file" accept=".npy">
        <button id="uploadBtn" class="ghost">上传 .npy</button>
      </div>
    </div>

    <div class="cta-row">
      <button id="btn" class="cta" disabled><span class="wave"><i></i><i></i><i></i><i></i></span>生成语音</button>
      <div class="hint">打开页面自动加载模型（约 40 秒）；关闭页面后释放 NPU 并自动退出服务，重新运行 start.sh 即可</div>
    </div>
  </section>

  <div class="card statusbar">
    <div class="status" id="status"></div>
  </div>

  <div class="audio-wrap card" id="audioWrap">
    <div class="res-head"><span class="t">合成音频</span><span class="n">每次生成覆盖上一条</span></div>
    <audio id="player" controls></audio>
  </div>
</div>

<script>
const btn   = document.getElementById("btn");
const text  = document.getElementById("text");
const instruct = document.getElementById("instruct");
const speaker  = document.getElementById("speaker");
const audioWrap = document.getElementById("audioWrap");
const player   = document.getElementById("player");
const status  = document.getElementById("status");
const voiceFile = document.getElementById("voiceFile");
const voiceName = document.getElementById("voiceName");
const uploadBtn = document.getElementById("uploadBtn");
const delVoiceBtn = document.getElementById("delVoiceBtn");

let audioUrl = null;
let ready = false;       // 引擎是否就绪
let generating = false;  // 是否正在合成
let customNames = [];    // 已上传的自定义音色名

// ── 音色列表（预置 / 内置克隆 / 我的音色）──────────────────────
function updateDelBtn() {
  delVoiceBtn.style.display = customNames.includes(speaker.value) ? "" : "none";
}

async function loadVoices(selectName) {
  const keep = selectName || speaker.value;
  try {
    const r = await fetch("/api/voices");
    const j = await r.json();
    speaker.innerHTML = "";
    const mk = v => { const o = document.createElement("option"); o.value = v.name; o.textContent = v.label; return o; };
    const def = document.createElement("option");
    def.value = ""; def.textContent = "默认（girl_base）";
    speaker.appendChild(def);
    const g1 = document.createElement("optgroup"); g1.label = "预置音色";
    j.preset.forEach(v => g1.appendChild(mk(v)));
    speaker.appendChild(g1);
    const g0 = document.createElement("optgroup"); g0.label = "克隆音色";
    j.builtin_clone.filter(v => v.name !== "girl_base").forEach(v => g0.appendChild(mk(v)));
    speaker.appendChild(g0);
    customNames = j.custom.map(v => v.name);
    const g2 = document.createElement("optgroup"); g2.label = "我的音色（提取/上传）";
    if (customNames.length === 0) {
      const o = document.createElement("option");
      o.value = ""; o.disabled = true; o.textContent = "（暂无，用下方录音或选文件提取）";
      g2.appendChild(o);
    } else {
      j.custom.forEach(v => g2.appendChild(mk(v)));
    }
    speaker.appendChild(g2);
    speaker.value = keep;
    if (speaker.value !== keep) speaker.value = "";  // 原选中项已被删
    updateDelBtn();
  } catch (e) { /* 服务未起时保持空下拉 */ }
}

uploadBtn.addEventListener("click", async () => {
  const f = voiceFile.files[0];
  const name = voiceName.value.trim().toLowerCase();
  if (!f) { setStatus("先选择 .npy 音色文件", err=true); return; }
  if (!/^[a-z0-9_\-]{1,24}$/.test(name)) { setStatus("音色名只能小写字母/数字/_/-，1~24 位", err=true); return; }
  uploadBtn.disabled = true;
  setStatus("上传中…");
  try {
    const r = await fetch("/api/voice/upload?name=" + encodeURIComponent(name),
                          { method: "POST", body: await f.arrayBuffer() });
    const j = await r.json();
    if (!r.ok) { setStatus(j.error || "上传失败", err=true); return; }
    await loadVoices(name);   // 上传完直接选中
    voiceFile.value = "";
    voiceName.value = "";
    setStatus("音色 " + name + " 已添加，输入文本试试像不像", ok=true);
  } catch (e) {
    setStatus("上传失败: " + e.message, err=true);
  } finally {
    uploadBtn.disabled = false;
  }
});

// ── 板端提取：音频文件 / 录音 → 24kHz mono float32 PCM → /api/voice/extract ──
const voiceAudio = document.getElementById("voiceAudio");
const recBtn     = document.getElementById("recBtn");
const extractBtn = document.getElementById("extractBtn");
let recBlob = null, recorder = null, recTimer = null;

// 浏览器里解码任意音频（wav/mp3/m4a/webm…）并重采样成 24kHz mono Float32
async function audioToPcm24k(blob) {
  const buf = await blob.arrayBuffer();
  const ctx = new (window.AudioContext || window.webkitAudioContext)();
  let decoded;
  try {
    decoded = await ctx.decodeAudioData(buf);
  } finally {
    ctx.close();
  }
  if (decoded.duration < 3)
    throw new Error("音频不足 3 秒（建议 5~10 秒）");
  const off = new OfflineAudioContext(1, Math.ceil(decoded.duration * 24000), 24000);
  const src = off.createBufferSource();
  src.buffer = decoded;
  src.connect(off.destination);
  src.start();
  const rendered = await off.startRendering();
  return rendered.getChannelData(0);
}

recBtn.addEventListener("click", async () => {
  if (recorder) { recorder.stop(); return; }  // 录音中再点一次 = 结束
  if (!navigator.mediaDevices || !window.isSecureContext) {
    setStatus("此环境不允许录音（需 localhost 或 https）：请改用「选音频文件」", err=true);
    return;
  }
  try {
    const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
    const chunks = [];
    recorder = new MediaRecorder(stream);
    recorder.ondataavailable = e => chunks.push(e.data);
    recorder.onstop = () => {
      stream.getTracks().forEach(t => t.stop());
      recBlob = new Blob(chunks, { type: recorder.mimeType || "audio/webm" });
      recorder = null;
      clearTimeout(recTimer);
      recBtn.textContent = "重新录音";
      setStatus("录音完成，点「提取音色」", ok=true);
    };
    recorder.start();
    recBtn.textContent = "停止录音";
    recTimer = setTimeout(() => { if (recorder) recorder.stop(); }, 12000);  // 最长 12s
  } catch (e) {
    recorder = null;
    setStatus("录音失败: " + e.message, err=true);
  }
});

extractBtn.addEventListener("click", async () => {
  const name = voiceName.value.trim().toLowerCase();
  if (!/^[a-z0-9_\-]{1,24}$/.test(name)) { setStatus("音色名只能小写字母/数字/_/-，1~24 位", err=true); return; }
  const blob = recBlob || voiceAudio.files[0] || null;
  if (!blob) { setStatus("先选音频文件或录一段音", err=true); return; }
  extractBtn.disabled = true;
  setStatus("板上提取音色中…");
  try {
    let pcm = await audioToPcm24k(blob);
    if (pcm.length > 240000) pcm = pcm.subarray(0, 240000);  // 引擎只取前 10 秒
    const r = await fetch("/api/voice/extract?name=" + encodeURIComponent(name),
                           { method: "POST", body: pcm.buffer });
    const j = await r.json();
    if (!r.ok) { setStatus(j.error || "提取失败", err=true); return; }
    await loadVoices(name);
    recBlob = null; voiceAudio.value = ""; voiceName.value = "";
    recBtn.textContent = "录音";
    setStatus("音色 " + name + " 已生成，输入文本试试像不像", ok=true);
  } catch (e) {
    setStatus("提取失败: " + e.message, err=true);
  } finally {
    extractBtn.disabled = false;
  }
});

delVoiceBtn.addEventListener("click", async () => {
  const name = speaker.value;
  if (!name || !customNames.includes(name)) return;
  if (!confirm("删除音色 " + name + "？")) return;
  try {
    const r = await fetch("/api/voice/delete", {
      method: "POST",
      headers: {"Content-Type": "application/json"},
      body: JSON.stringify({ name }),
    });
    const j = await r.json();
    if (!r.ok) { setStatus(j.error || "删除失败", err=true); return; }
    await loadVoices();
    setStatus("已删除 " + name, ok=true);
  } catch (e) {
    setStatus("删除失败: " + e.message, err=true);
  }
});

speaker.addEventListener("change", updateDelBtn);

function setStatus(msg, ok=false, err=false) {
  status.textContent = msg;
  status.className = "status" + (ok ? " ok" : err ? " err" : "");
}

// 轮询后端探活：加载中显示“正在加载模型”，就绪后启用按钮
async function pollStatus() {
  if (generating) return;  // 合成期间不打扰状态显示
  try {
    const r = await fetch("/api/status");
    const j = await r.json();
    if (j.status === "ready") {
      ready = true;
      btn.disabled = false;
      setStatus("模型已就绪，可以生成", ok=true);
      setTimeout(heartbeat, 5000);  // 就绪后转慢心跳：页面开着服务不退
      return;
    }
    ready = false;
    btn.disabled = true;
    setStatus("正在加载模型…");
  } catch(e) {
    ready = false;
    btn.disabled = true;
    setStatus("正在加载模型…");
  }
  setTimeout(pollStatus, 2000);
}

btn.addEventListener("click", async () => {
  const t = text.value.trim();
  const inst = instruct.value.trim();
  const spk = speaker.value;
  if (!t) { setStatus("请输入文本", err=true); return; }
  generating = true;
  btn.disabled = true;
  setStatus("正在生成…");
  try {
    const r = await fetch("/api/speak", {
      method: "POST",
      headers: {"Content-Type": "application/json"},
      body: JSON.stringify({ text: t, instruct: inst, speaker: spk }),
    });
    if (!r.ok) {
      const j = await r.json();
      setStatus(j.error || "生成失败", err=true);
      return;
    }
    if (audioUrl) URL.revokeObjectURL(audioUrl);
    audioUrl = URL.createObjectURL(await r.blob());
    player.src = audioUrl;
    audioWrap.classList.add("show");
    setStatus("生成完毕，点播放按钮听", ok=true);
  } catch(e) {
    setStatus("网络错误: " + e.message, err=true);
  } finally {
    generating = false;
    btn.disabled = !ready;  // 就绪则启用，否则继续等待轮询
  }
});

// 就绪后的慢心跳（5s）：
//   ① 页面开着 → 服务/引擎一直活着（关页才释放 NPU 并退出）
//   ② 多开了标签页时，关掉其中一个不再误杀服务（另一页的心跳会取消退出）
//   ③ 服务真退出了 → 给明确提示，而不是点按钮没反应
async function heartbeat() {
  if (generating) { setTimeout(heartbeat, 5000); return; }
  try {
    await fetch("/api/status");
    setTimeout(heartbeat, 5000);
  } catch (e) {
    ready = false;
    btn.disabled = true;
    setStatus("服务已退出，请重新运行 start.sh 后刷新页面", err=true);
  }
}

// 页面打开即开始加载模型 + 轮询状态
window.addEventListener("pageshow", () => {
  btn.disabled = true;
  setStatus("正在加载模型…");
  loadVoices();
  pollStatus();
});

// pagehide：页面关闭时通知后端释放 NPU
window.addEventListener("pagehide", () => {
  navigator.sendBeacon("/api/bye");
});
</script>
