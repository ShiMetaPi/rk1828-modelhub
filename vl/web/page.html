<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>RK1828 · Qwen2.5-VL 视频问答</title>
<style>
  :root { --bg:#0f1115; --panel:#181b22; --line:#2a2f3a; --txt:#e8eaf0; --dim:#8b93a5;
          --acc:#4f8cff; --user:#2b5cc0; --bot:#232833; --warn:#c0392b; }
  * { box-sizing:border-box; margin:0; }
  body { background:var(--bg); color:var(--txt);
         font-family:"Segoe UI",system-ui,-apple-system,"PingFang SC","Microsoft YaHei",sans-serif;
         height:100vh; display:flex; flex-direction:column; }
  header { display:flex; align-items:center; gap:12px; padding:10px 16px;
           background:var(--panel); border-bottom:1px solid var(--line); }
  header h1 { font-size:15px; font-weight:600; flex:1; }
  #dot { width:10px; height:10px; border-radius:50%; background:#555; flex:none; }
  #dot.ok { background:#2ecc71; } #dot.bad { background:var(--warn); }
  #banner { display:none; padding:6px 16px; font-size:12px; color:#fff;
            background:var(--warn); }
  main { flex:1; display:flex; min-height:0; }
  #left { width:58%; padding:12px; display:flex; align-items:center;
          justify-content:center; background:#000; position:relative; }
  #left img { max-width:100%; max-height:100%;
              transform:rotate(180deg);   /* 摄像头倒装，浏览器端翻正，板子零开销 */
              border:1px solid var(--line); }
  #left .off { color:var(--dim); font-size:13px; position:absolute; }
  #right { width:42%; display:flex; flex-direction:column; border-left:1px solid var(--line); }
  #chat { flex:1; overflow-y:auto; padding:12px; display:flex;
          flex-direction:column; gap:10px; }
  .msg { max-width:88%; padding:8px 12px; border-radius:10px; font-size:14px;
         line-height:1.55; white-space:pre-wrap; word-break:break-word; }
  .user { align-self:flex-end; background:var(--user); color:#fff; }
  .bot  { align-self:flex-start; background:var(--bot); }
  .bot.error { border:1px solid var(--warn); color:#f0a0a0; }
  .stats { display:block; margin-top:6px; font-size:11px; color:var(--dim); }
  .notice { align-self:center; max-width:92%; padding:4px 12px; font-size:12px;
            color:var(--dim); background:var(--panel); border:1px dashed var(--line);
            border-radius:8px; text-align:center; }
  .dots span { animation:blink 1.2s infinite; }
  .dots span:nth-child(2){animation-delay:.2s}.dots span:nth-child(3){animation-delay:.4s}
  @keyframes blink { 0%,80%,100%{opacity:.2} 40%{opacity:1} }
  #inputbar { display:flex; gap:8px; padding:10px; border-top:1px solid var(--line); }
  #q { flex:1; background:var(--panel); border:1px solid var(--line); color:var(--txt);
       border-radius:8px; padding:9px 12px; font-size:14px; outline:none; }
  #q:focus { border-color:var(--acc); }
  button { background:var(--acc); color:#fff; border:0; border-radius:8px;
           padding:9px 16px; font-size:14px; cursor:pointer; }
  button:disabled { opacity:.45; cursor:default; }
  #reset { background:transparent; border:1px solid var(--line); color:var(--dim); }
</style>
</head>
<body>
<header>
  <h1>RK1828 · Qwen2.5-VL 视频问答 <small id="camname" style="color:var(--dim);font-weight:400"></small></h1>
  <div id="dot"></div>
  <button id="reset">重置对话</button>
</header>
<div id="banner"></div>
<main>
  <div id="left">
    <img id="cam" src="/stream" alt="">
    <div class="off" id="camoff" style="display:none">等待摄像头画面…</div>
  </div>
  <div id="right">
    <div id="chat"></div>
    <div id="inputbar">
      <input id="q" placeholder="看着画面提问，回车发送（Shift+回车换行）" autocomplete="off">
      <button id="send">发送</button>
    </div>
  </div>
</main>
<script>
const chat = document.getElementById('chat');
const q = document.getElementById('q');
const sendBtn = document.getElementById('send');
const camImg = document.getElementById('cam');
const camOff = document.getElementById('camoff');

function addBubble(cls, text) {
  const d = document.createElement('div');
  d.className = 'msg ' + cls;
  d.textContent = text;
  chat.appendChild(d);
  chat.scrollTop = chat.scrollHeight;
  return d;
}

let busy = false;
async function ask() {
  const text = q.value.trim();
  if (!text || busy) return;
  busy = true; sendBtn.disabled = true; q.value = '';
  addBubble('user', text);
  const bot = addBubble('bot', '');
  bot.innerHTML = '<span class="dots"><span>●</span><span>●</span><span>●</span></span>';
  try {
    const res = await fetch('/ask', {method:'POST', body:text});
    if (!res.ok) throw new Error(await res.text() || ('HTTP ' + res.status));
    const reader = res.body.getReader();
    const dec = new TextDecoder();
    let acc = '', done = false;
    while (!done) {
      const {value, done:d} = await reader.read();
      if (d) break;
      acc += dec.decode(value, {stream:true});
      let nl;
      while ((nl = acc.indexOf('\n')) >= 0) {
        const line = acc.slice(0, nl); acc = acc.slice(nl + 1);
        if (line.startsWith('@@STATS ')) {
          const s = JSON.parse(line.slice(8));
          bot.innerHTML = escapeHtml(bot.dataset.ans || '') +
            '<span class="stats">视觉 ' + (s.vit_ms||0).toFixed(0) + 'ms · prefill ' +
            (s.prefill_ms||0).toFixed(0) + 'ms · decode ' + (s.decode_ms||0).toFixed(0) +
            'ms</span>';
          done = true; break;
        } else if (line.startsWith('@@NOTICE ')) {
          const n = document.createElement('div');
          n.className = 'notice';
          n.textContent = line.slice(9);
          chat.appendChild(n); chat.scrollTop = chat.scrollHeight;
        } else if (line.startsWith('@@ERROR ')) {
          bot.className = 'msg bot error';
          bot.textContent = line.slice(8);
          done = true; break;
        } else if (line) { bot.dataset.ans = (bot.dataset.ans || '') + line + '\n'; }
      }
      if (!done) bot.textContent = bot.dataset.ans || '';
      chat.scrollTop = chat.scrollHeight;
    }
    if (!done && !bot.textContent) bot.textContent = bot.dataset.ans || '（连接中断）';
  } catch (e) {
    bot.className = 'msg bot error';
    bot.textContent = '发送失败：' + e.message;
  }
  busy = false; sendBtn.disabled = false; q.focus();
}

function escapeHtml(s) {
  return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
}

sendBtn.onclick = ask;
q.addEventListener('keydown', e => {
  if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); ask(); }
});
document.getElementById('reset').onclick = async () => {
  await fetch('/reset', {method:'POST'}).catch(()=>{});
  chat.innerHTML = '';
  addBubble('bot', '对话上下文已重置。');
};

// 预览帧到达检测 + 状态轮询
let sawFrame = false;
camImg.onload = () => { sawFrame = true; camOff.style.display = 'none'; };
async function poll() {
  let st = {engine:false, status:''};
  try { st = await (await fetch('/status')).json(); } catch (e) {}
  const dot = document.getElementById('dot');
  dot.className = st.engine ? 'ok' : 'bad';
  const banner = document.getElementById('banner');
  const bad = !st.engine || (st.status || '').includes('离线');
  if (bad && st.status) { banner.textContent = st.status; banner.style.display = 'block'; }
  else banner.style.display = 'none';
  if (!sawFrame) camOff.style.display = '';
}
poll();
setInterval(poll, 3000);
</script>
</body>
</html>
