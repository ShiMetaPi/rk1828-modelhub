<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>RK1828 · Qwen2.5-VL 视频问答</title>
<style>
  /* 蓝白 Apple 风（全 demo 定稿设计体系，与 depth_apple.html 同源 token）：
     蓝白渐变画布、毛玻璃卡片、系统蓝 #007AFF、胶囊按钮、大圆角软阴影 */
  :root {
    --blue: #007aff;          /* Apple 系统蓝 */
    --blue-hover: #0066cc;
    --blue-tint: #e8f2ff;
    --text: #1d1d1f;          /* Apple 近黑 */
    --text-2: #6e6e73;        /* Apple 次级灰 */
    --text-3: #8e8e93;
    --hairline: rgba(0, 0, 0, .08);
    --card: rgba(255, 255, 255, .78);
    --card-solid: rgba(255, 255, 255, .94);
    --fill: #f2f2f7;          /* systemGray6 */
    --shadow: 0 10px 30px rgba(15, 70, 150, .10);
    --shadow-sm: 0 2px 10px rgba(15, 70, 150, .07);
    --ok: #34c759; --warn: #ff9500; --err: #ff3b30;
    --sans: -apple-system, "SF Pro Display", "Helvetica Neue", "Noto Sans CJK SC",
            "PingFang SC", "Microsoft YaHei", sans-serif;
    --mono: ui-monospace, "SF Mono", Menlo, Consolas, "Noto Sans Mono CJK SC", monospace;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: var(--sans);
    /* 蓝白渐变画布：顶部淡蓝晕染渐入纯白 */
    background:
      radial-gradient(1100px 500px at 50% -8%, rgba(120, 175, 255, .28), transparent 70%),
      linear-gradient(180deg, #e3effc 0%, #f0f6fe 32%, #fbfdff 66%, #ffffff 100%);
    background-attachment: fixed;
    color: var(--text);
    height: 100vh;
    display: flex; flex-direction: column; align-items: center;
    padding: 32px 20px 22px;
    overflow: hidden;
  }
  ::selection { background: rgba(0, 122, 255, .18); }
  :focus-visible { outline: 3px solid rgba(0, 122, 255, .45); outline-offset: 2px; border-radius: 6px; }
  .wrap { width: min(1200px, 100%); flex: 1; min-height: 0;
          display: flex; flex-direction: column; }

  /* ── 居中轻刊头 ───────────────────────────────────────────────────── */
  .hero { text-align: center; margin-bottom: 20px;
          animation: rise .55s cubic-bezier(.25,.1,.25,1) both; }
  .tag { display: inline-block; font-size: 11.5px; font-weight: 600; letter-spacing: .04em;
         color: #0a63d2; background: var(--blue-tint);
         padding: 5px 13px; border-radius: 9999px; margin-bottom: 12px; }
  .hero h1 { font-size: 30px; font-weight: 700; letter-spacing: -0.022em; line-height: 1.1;
             color: var(--blue); }
  .hero .lede { margin-top: 8px; font-size: 14px; color: var(--text-2); line-height: 1.6; }

  /* ── 服务状态横幅（JS 控制显隐，默认隐藏）────────────────────────── */
  #banner { display: none; margin: 0 0 16px; padding: 10px 18px;
            border-radius: 12px; font-size: 13px; line-height: 1.55;
            color: #d70015; background: rgba(255, 59, 48, .07);
            border: 1px solid rgba(255, 59, 48, .25);
            animation: rise .3s cubic-bezier(.25,.1,.25,1) both; }

  /* ── 主区：左视频卡 + 右对话卡 ───────────────────────────────────── */
  .layout { flex: 1; min-height: 0;
            display: grid; grid-template-columns: minmax(0, 1.3fr) minmax(0, 1fr);
            gap: 18px; }
  .card {
    background: var(--card);
    backdrop-filter: blur(20px) saturate(1.35);
    -webkit-backdrop-filter: blur(20px) saturate(1.35);
    border: 1px solid var(--hairline);
    border-radius: 18px;
    box-shadow: var(--shadow);
    min-height: 0;
  }

  /* ── 视频卡：媒体框风格（深底、圆角 14、软阴影）─────────────────── */
  .viewcol { display: flex; flex-direction: column; gap: 12px; padding: 16px;
             animation: rise .55s cubic-bezier(.25,.1,.25,1) both; animation-delay: .07s; }
  .stage { flex: 1; min-height: 0; position: relative;
           display: flex; align-items: center; justify-content: center;
           background: #0b1a2e; border-radius: 14px; overflow: hidden;
           box-shadow: var(--shadow-sm); }
  #cam { max-width: 100%; max-height: 100%; display: block;
         transform: rotate(180deg);   /* 摄像头倒装，浏览器端翻正，板子零开销 */
         border-radius: 6px; }
  .off { position: absolute; inset: 0;
         display: flex; align-items: center; justify-content: center;
         padding: 24px; text-align: center;
         color: rgba(255, 255, 255, .55); font-size: 13px; line-height: 1.7; }
  .vstat { display: flex; align-items: center; gap: 8px; padding: 0 4px;
           font-size: 12px; color: var(--text-3);
           font-variant-numeric: tabular-nums; }
  /* JS 会整体覆写 #dot 的 class（'ok' / 'bad'），基础样式必须挂在 ID 上 */
  #dot { width: 8px; height: 8px; border-radius: 50%; background: #c7c7cc; flex: none;
         transition: background .3s, box-shadow .3s; }
  #dot.ok  { background: var(--ok);  box-shadow: 0 0 0 3px rgba(52, 199, 89, .18); }
  #dot.bad { background: var(--err); box-shadow: 0 0 0 3px rgba(255, 59, 48, .16); }
  .vname { color: var(--text-2); }
  .vstat .spacer { flex: 1; }

  /* ── 对话卡：气泡 + 发送框 ───────────────────────────────────────── */
  .chatcol { display: flex; flex-direction: column;
             animation: rise .55s cubic-bezier(.25,.1,.25,1) both; animation-delay: .14s; }
  .chat-head { display: flex; align-items: center; gap: 10px;
               padding: 14px 16px 10px; border-bottom: 1px solid var(--hairline); }
  .chat-title { font-size: 14px; font-weight: 600; letter-spacing: -0.01em; }
  .chat-title .cd { display: inline-block; width: 7px; height: 7px; border-radius: 50%;
                    background: var(--blue); margin-right: 8px; vertical-align: 1px; }
  .chat-head .spacer { flex: 1; }
  #reset { background: #fff; border: 1px solid var(--hairline); color: var(--text-2);
           font-family: var(--sans); font-size: 12.5px; font-weight: 500;
           padding: 7px 15px; border-radius: 9999px; cursor: pointer;
           transition: color .2s, background .2s, border-color .2s; }
  #reset:hover { color: #0a63d2; background: var(--blue-tint); border-color: rgba(0, 122, 255, .3); }
  #reset:focus-visible { border-radius: 9999px; }

  #chat { flex: 1; min-height: 0; overflow-y: auto;
          padding: 14px 14px 10px; display: flex; flex-direction: column; gap: 12px; }
  #chat::-webkit-scrollbar { width: 8px; }
  #chat::-webkit-scrollbar-thumb { background: rgba(0, 0, 0, .14); border-radius: 4px; }
  #chat::-webkit-scrollbar-track { background: transparent; }

  /* 空对话欢迎空态（#chat 无任何子节点时出现，注意 HTML 里不能留空白字符） */
  #chat:empty::after {
    content: "先看左边的实时画面，想问什么直接输入。\A 比如：「画面里有什么？」「桌上那本书是什么？」\A 支持多轮追问，模型会记住前面聊过的内容。";
    white-space: pre-line;
    display: block; margin: auto; text-align: center;
    padding: 34px 22px;
    border: 1.5px dashed rgba(0, 0, 0, .12); border-radius: 18px;
    color: var(--text-3); font-size: 13px; line-height: 1.9;
  }

  /* 聊天气泡：用户 = 系统蓝底白字靠右；AI = 白卡 hairline 边靠左；圆角 16 */
  .msg { max-width: 86%; padding: 10px 14px; border-radius: 16px;
         font-size: 14px; line-height: 1.62;
         white-space: pre-wrap; word-break: break-word;
         animation: rise .3s cubic-bezier(.25,.1,.25,1) both; }
  .msg.user { align-self: flex-end; color: #fff; background: var(--blue);
              box-shadow: 0 6px 16px rgba(0, 122, 255, .22); }
  .msg.bot { align-self: flex-start; color: var(--text);
             background: var(--card-solid); border: 1px solid var(--hairline);
             box-shadow: var(--shadow-sm); }
  .msg.bot.error { color: #d70015; background: rgba(255, 255, 255, .94);
                   border-color: rgba(255, 59, 48, .4); }
  .stats { display: block; margin-top: 8px; padding-top: 6px;
           border-top: 1px solid var(--hairline);
           font-family: var(--mono); font-variant-numeric: tabular-nums;
           font-size: 11.5px; color: var(--text-3); }
  .dots { display: inline-block; padding: 2px 0; color: var(--text-3); }
  .dots span { animation: blink 1.2s infinite; }
  .dots span:nth-child(2){animation-delay:.2s}.dots span:nth-child(3){animation-delay:.4s}
  @keyframes blink { 0%,80%,100%{opacity:.2} 40%{opacity:1} }
  .notice { align-self: center; max-width: 92%; padding: 5px 14px;
            font-size: 12px; color: var(--text-2); background: var(--fill);
            border-radius: 9999px; text-align: center; line-height: 1.6; }

  /* ── 发送框：底部白卡条 + 胶囊蓝色发送按钮 ───────────────────────── */
  #inputbar { display: flex; gap: 10px; padding: 12px 14px 14px;
              border-top: 1px solid var(--hairline); }
  #q { flex: 1; min-width: 0; height: 40px;
       background: var(--fill); border: 1.5px solid transparent; border-radius: 9999px;
       padding: 0 18px; font-family: var(--sans); font-size: 14px; color: var(--text);
       outline: none; transition: border-color .2s, background .2s; }
  #q::placeholder { color: var(--text-3); }
  #q:focus { border-color: var(--blue); background: #fff; }
  #q:focus-visible { border-radius: 9999px; }
  #send { border: 0; background: var(--blue); color: #fff;
          font-family: var(--sans); font-size: 14px; font-weight: 600; letter-spacing: .01em;
          height: 40px; padding: 0 24px; border-radius: 9999px; cursor: pointer;
          flex: none;
          box-shadow: 0 6px 16px rgba(0, 122, 255, .28);
          transition: background .2s, transform .15s, box-shadow .2s; }
  #send:hover:not(:disabled) { background: var(--blue-hover); }
  #send:active:not(:disabled) { transform: scale(.97); }
  #send:disabled { opacity: .35; cursor: not-allowed; box-shadow: none; }
  #send:focus-visible { border-radius: 9999px; }

  @keyframes rise { from { opacity: 0; transform: translateY(14px); } }
  @media (max-width: 960px) {
    body { height: auto; min-height: 100vh; overflow: auto; padding: 30px 14px 40px; }
    .hero h1 { font-size: 27px; }
    .layout { grid-template-columns: 1fr; }
    .stage { flex: none; aspect-ratio: 4 / 3; }
    .chatcol { min-height: 520px; }
  }
  @media (prefers-reduced-motion: reduce) {
    * { animation: none !important; transition: none !important; }
  }
</style>
</head>
<body>
<div class="wrap">
  <header class="hero">
    <span class="tag">Qwen2.5-VL-3B · RK1828 NPU</span>
    <h1>视频问答</h1>
    <p class="lede">左边看画面，右边开口问。多轮对话共享上下文，回答流式输出，并附上视觉与生成各段耗时。</p>
  </header>

  <div id="banner"></div>

  <main class="layout">
    <section class="card viewcol">
      <div class="stage">
        <img id="cam" src="/stream" alt="">
        <div class="off" id="camoff" style="display:none">等待摄像头画面…</div>
      </div>
      <div class="vstat">
        <div id="dot"></div>
        <span>引擎</span>
        <span class="vname" id="camname"></span>
        <div class="spacer"></div>
        <span>实时预览</span>
      </div>
    </section>

    <section class="card chatcol">
      <div class="chat-head">
        <span class="chat-title"><span class="cd"></span>多轮对话</span>
        <div class="spacer"></div>
        <button id="reset" type="button">重置对话</button>
      </div>
      <div id="chat"></div>
      <div id="inputbar">
        <input id="q" placeholder="看着画面提问，回车发送（Shift+回车换行）" autocomplete="off">
        <button id="send" type="button">发送</button>
      </div>
    </section>
  </main>
</div>

<script>
const chat = document.getElementById('chat');
const q = document.getElementById('q');
const sendBtn = document.getElementById('send');
const camImg = document.getElementById('cam');
const camOff = document.getElementById('camoff');

function addBubble(cls, text) {
  const d = document.createElement('div');
  d.className = 'msg ' + cls;
  d.textContent = text;
  chat.appendChild(d);
  chat.scrollTop = chat.scrollHeight;
  return d;
}

let busy = false;
async function ask() {
  const text = q.value.trim();
  if (!text || busy) return;
  busy = true; sendBtn.disabled = true; q.value = '';
  addBubble('user', text);
  const bot = addBubble('bot', '');
  bot.innerHTML = '<span class="dots"><span>●</span><span>●</span><span>●</span></span>';
  try {
    const res = await fetch('/ask', {method:'POST', body:text});
    if (!res.ok) throw new Error(await res.text() || ('HTTP ' + res.status));
    const reader = res.body.getReader();
    const dec = new TextDecoder();
    let acc = '', done = false;
    while (!done) {
      const {value, done:d} = await reader.read();
      if (d) break;
      acc += dec.decode(value, {stream:true});
      let nl;
      while ((nl = acc.indexOf('\n')) >= 0) {
        const line = acc.slice(0, nl); acc = acc.slice(nl + 1);
        if (line.startsWith('@@STATS ')) {
          const s = JSON.parse(line.slice(8));
          bot.innerHTML = escapeHtml(bot.dataset.ans || '') +
            '<span class="stats">视觉 ' + (s.vit_ms||0).toFixed(0) + 'ms · prefill ' +
            (s.prefill_ms||0).toFixed(0) + 'ms · decode ' + (s.decode_ms||0).toFixed(0) +
            'ms</span>';
          done = true; break;
        } else if (line.startsWith('@@NOTICE ')) {
          const n = document.createElement('div');
          n.className = 'notice';
          n.textContent = line.slice(9);
          chat.appendChild(n); chat.scrollTop = chat.scrollHeight;
        } else if (line.startsWith('@@ERROR ')) {
          bot.className = 'msg bot error';
          bot.textContent = line.slice(8);
          done = true; break;
        } else if (line) { bot.dataset.ans = (bot.dataset.ans || '') + line + '\n'; }
      }
      if (!done) bot.textContent = bot.dataset.ans || '';
      chat.scrollTop = chat.scrollHeight;
    }
    if (!done && !bot.textContent) bot.textContent = bot.dataset.ans || '（连接中断）';
  } catch (e) {
    bot.className = 'msg bot error';
    bot.textContent = '发送失败：' + e.message;
  }
  busy = false; sendBtn.disabled = false; q.focus();
}

function escapeHtml(s) {
  return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
}

sendBtn.onclick = ask;
q.addEventListener('keydown', e => {
  if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); ask(); }
});
document.getElementById('reset').onclick = async () => {
  await fetch('/reset', {method:'POST'}).catch(()=>{});
  chat.innerHTML = '';
  addBubble('bot', '对话上下文已重置。');
};

// 预览帧到达检测 + 状态轮询
let sawFrame = false;
camImg.onload = () => { sawFrame = true; camOff.style.display = 'none'; };
async function poll() {
  let st = {engine:false, status:''};
  try { st = await (await fetch('/status')).json(); } catch (e) {}
  const dot = document.getElementById('dot');
  dot.className = st.engine ? 'ok' : 'bad';
  const banner = document.getElementById('banner');
  const bad = !st.engine || (st.status || '').includes('离线');
  if (bad && st.status) { banner.textContent = st.status; banner.style.display = 'block'; }
  else banner.style.display = 'none';
  if (!sawFrame) camOff.style.display = '';
}
poll();
setInterval(poll, 3000);

// 页面关闭时通知后端：释放引擎并退出服务（重新运行 start.sh 即可）
window.addEventListener('pagehide', () => { navigator.sendBeacon('/bye'); });
</script>
</body>
</html>
